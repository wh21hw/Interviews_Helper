[metadata]
name = interviews-helper
version = 0.1.0
description = Agent-first, evidence-backed interview library builder
long_description = file: README.md
long_description_content_type = text/markdown
author = wh21hw
license = MIT
license_files = LICENSE
url = https://github.com/wh21hw/Interviews_Helper
project_urls =
    Issues = https://github.com/wh21hw/Interviews_Helper/issues
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    playwright>=1.48,<2
    rapidocr>=3.0,<4
    onnxruntime>=1.19,<2

[options.packages.find]
where = src

[options.package_data]
interviews_helper.report = template.html

[options.extras_require]
dev =
    pytest>=8
    ruff>=0.8
vectors =
    sentence-transformers>=2.6

[options.entry_points]
console_scripts =
    interviews-helper = interviews_helper.cli:main
