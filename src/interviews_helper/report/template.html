<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interviews Helper · 专属面经库</title>
  <style>
    :root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#1c2430;--muted:#657080;--line:#ded8cc;--red:#c64232;--blue:#245f78;--gold:#b27a24;--shadow:0 16px 45px rgba(39,31,20,.09)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
    header{padding:52px max(24px,calc((100vw - 1240px)/2));background:linear-gradient(120deg,#172b35,#244f5e 56%,#b8523d);color:white}
    .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.72}.hero{display:flex;justify-content:space-between;gap:32px;align-items:flex-end}
    h1{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(34px,5vw,64px);line-height:1.02;margin:14px 0 12px}.subtitle{max-width:760px;opacity:.84;line-height:1.8;margin:0}
    .hero-count{font:700 64px/1 Georgia,serif;white-space:nowrap}.hero-count small{display:block;font:12px/1.3 Inter,sans-serif;letter-spacing:.12em;margin-top:8px;opacity:.65;text-align:right}
    main{max-width:1240px;margin:0 auto;padding:28px 24px 70px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-48px;position:relative}
    .stat{background:var(--paper);padding:19px 22px;border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow)}.stat b{display:block;font:700 30px/1.1 Georgia,serif}.stat span{font-size:12px;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:minmax(280px,1fr) repeat(4,minmax(135px,190px));gap:10px;margin:28px 0 16px;position:sticky;top:0;padding:12px 0;background:rgba(244,241,234,.94);backdrop-filter:blur(12px);z-index:3}
    input,select{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,95,120,.1)}
    .tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);background:transparent;padding:9px 15px;cursor:pointer}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font:700 24px Georgia,"Noto Serif SC",serif;margin:0}.result-count{font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);padding:20px;box-shadow:0 4px 12px rgba(30,25,18,.035);transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .card-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#e6eef1;color:var(--blue)}.badge.topic{background:#f3e9d8;color:#80581d}.badge.conf-A{background:#deeee5;color:#17603a}.badge.conf-C{background:#f5dfdc;color:#963d31}.freq{margin-left:auto;font-size:12px;color:var(--red);font-weight:700}
    .question{font-size:17px;font-weight:650;line-height:1.65;margin:13px 0 16px}.source{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.source a{color:var(--blue);text-decoration:none}.source a:hover{text-decoration:underline}
    .post-title{font-size:17px;font-weight:700;line-height:1.5;margin:12px 0 8px}.post-desc{font-size:13px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.empty{grid-column:1/-1;padding:64px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line)}
    footer{color:var(--muted);font-size:12px;line-height:1.7;margin-top:34px;border-top:1px solid var(--line);padding-top:18px}.hidden{display:none!important}
    @media(max-width:820px){.hero{display:block}.hero-count{margin-top:24px}.hero-count small{text-align:left}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="eyebrow">PERSONAL INTERVIEW KNOWLEDGE BASE</div><div class="hero"><div><h1>Interviews Helper · 专属面经库</h1><p class="subtitle">输入目标岗位，把分散的公开面经整理成可检索、可追溯的题库。每道题保留来源证据、可信度与出现次数。</p></div><div class="hero-count" id="heroCount">0<small>UNIQUE QUESTIONS</small></div></div></header>
  <main>
    <div class="stats"><div class="stat"><b id="questionStat">0</b><span>去重问题</span></div><div class="stat"><b id="postStat">0</b><span>来源文章</span></div><div class="stat"><b id="platformStat">0</b><span>来源平台</span></div><div class="stat"><b id="highStat">0</b><span>A 级来源</span></div></div>
    <div class="toolbar"><input id="search" placeholder="搜索模型、公司、题目……"><select id="company"><option value="">全部公司</option></select><select id="topic"><option value="">全部主题</option></select><select id="platform"><option value="">全部平台</option></select><select id="quality"><option value="">全部质量</option><option value="high">质量 ≥ 70</option><option value="verified">至少两个来源</option></select></div>
    <div class="tabs"><button class="tab active" data-view="questions">问题库</button><button class="tab" data-view="posts">来源文章</button></div>
    <section id="questionsView"><div class="section-head"><h2>面试问题</h2><span class="result-count" id="questionCount"></span></div><div class="grid" id="questionGrid"></div></section>
    <section id="postsView" class="hidden"><div class="section-head"><h2>来源文章</h2><span class="result-count" id="postCount"></span></div><div class="grid" id="postGrid"></div></section>
    <footer>生成时间：__GENERATED_AT__。A 表示正文可见且岗位明确；B 表示相邻岗位或信息不完整；C 表示公开页面仅部分可见。程序遇到登录或验证码时停止自动采集，不绕过平台访问控制。</footer>
  </main>
  <script>
    const DATA=__DATA__; let view='questions';
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const unique=(arr)=>[...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
    function options(id,values){const el=$(id);for(const v of unique(values)){const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)}}
    const values=(x,key,fallback)=>Array.isArray(x[key])?x[key]:[x[fallback]].filter(Boolean);
    options('#company',DATA.questions.flatMap(x=>values(x,'companies','company')));options('#topic',DATA.questions.map(x=>x.topic));options('#platform',DATA.questions.flatMap(x=>values(x,'platforms','platform')));
    $('#heroCount').firstChild.nodeValue=DATA.questions.length;$('#questionStat').textContent=DATA.questions.length;$('#postStat').textContent=DATA.posts.length;$('#platformStat').textContent=unique(DATA.posts.map(x=>x.platform)).length;$('#highStat').textContent=DATA.posts.filter(x=>x.confidence==='A').length;
    function filters(){return{q:$('#search').value.trim().toLowerCase(),company:$('#company').value,topic:$('#topic').value,platform:$('#platform').value,quality:$('#quality').value}}
    function questionCard(x){const companies=values(x,'companies','company'),platforms=values(x,'platforms','platform');const badges=companies.slice(0,4).map(v=>`<span class="badge">${esc(v)}</span>`).join('');const links=x.sources.slice(0,3).map(s=>{const e=s.evidence||{},where=e.type==='ocr'&&e.page?` · 图片第 ${e.page} 页`:e.line?` · 正文第 ${e.line} 行`:'';return `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(e.excerpt||'')}">${esc(s.title)}${where}</a>`}).join(' · ');return `<article class="card"><div class="card-top">${badges}<span class="badge topic">${esc(x.topic)}</span><span class="badge conf-${esc(x.confidence)}">质量 ${Math.round((x.quality_score??0)*100)}</span>${x.frequency>1?`<span class="freq">${x.frequency} 个独立来源</span>`:''}</div><div class="question">${esc(x.question)}</div><div class="source"><span>${links}</span><span>${esc(platforms.join(' / '))}</span></div></article>`}
    function postCard(x){const state=x.is_complete?'完整':'部分';return `<article class="card"><div class="card-top"><span class="badge">${esc(x.company)}</span><span class="badge topic">${esc(x.business)}</span><span class="badge conf-${esc(x.confidence)}">可信度 ${esc(x.confidence)}</span><span class="badge">${esc(x.collection_depth||'text')} · ${state}</span></div><div class="post-title"><a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(x.title)}</a></div><div class="post-desc">${esc(x.text)}</div><div class="source"><span>${esc(x.platform)}</span><span>${esc(x.date||'日期未记录')}</span></div></article>`}
    function render(){const f=filters();const qs=DATA.questions.filter(x=>(!f.company||values(x,'companies','company').includes(f.company))&&(!f.topic||x.topic===f.topic)&&(!f.platform||values(x,'platforms','platform').includes(f.platform))&&(!f.quality||(f.quality==='high'?(x.quality_score??0)>=.7:(x.independent_source_count??x.frequency)>=2))&&(!f.q||JSON.stringify(x).toLowerCase().includes(f.q)));const ps=DATA.posts.filter(x=>(!f.company||x.company===f.company)&&(!f.platform||x.platform===f.platform)&&(!f.q||JSON.stringify(x).toLowerCase().includes(f.q)));$('#questionGrid').innerHTML=qs.map(questionCard).join('')||'<div class="empty">没有匹配的问题</div>';$('#postGrid').innerHTML=ps.map(postCard).join('')||'<div class="empty">没有匹配的来源</div>';$('#questionCount').textContent=`显示 ${qs.length} / ${DATA.questions.length}`;$('#postCount').textContent=`显示 ${ps.length} / ${DATA.posts.length}`}
    for(const id of ['#search','#company','#topic','#platform','#quality'])$(id).addEventListener(id==='#search'?'input':'change',render);
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('#questionsView').classList.toggle('hidden',view!=='questions');$('#postsView').classList.toggle('hidden',view!=='posts')}));render();
  </script>
</body>
</html>
