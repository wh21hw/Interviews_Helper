name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps -e .
      - run: python -c "import unittest; n=unittest.defaultTestLoader.discover('tests').countTestCases(); print(f'discovered {n} tests'); assert n >= 19"
      - run: python -m unittest discover -s tests -v
      - run: interviews-helper --help
